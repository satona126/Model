<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3Dシュミレーション Vr.1.0.2</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #beam-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }
    .panel {
      pointer-events: auto;
      background: rgba(20, 25, 35, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    /* 上部左ボタン群（図鑑＆コード） */
    #top-left-buttons {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 10px;
      z-index: 6;
      pointer-events: none;
    }
    .top-btn {
      pointer-events: auto;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .top-btn:hover {
      transform: scale(1.05);
    }
    .top-btn:active {
      transform: scale(0.95);
    }
    #pokedex-toggle-btn {
      background: linear-gradient(135deg, #2196f3, #00bcd4);
      box-shadow: 0 4px 15px rgba(0, 188, 212, 0.5);
    }
    #pokedex-toggle-btn:hover {
      box-shadow: 0 6px 20px rgba(0, 188, 212, 0.8);
    }
    #code-toggle-btn {
      background: linear-gradient(135deg, #9c27b0, #e040fb);
      box-shadow: 0 4px 15px rgba(224, 64, 251, 0.5);
    }
    #code-toggle-btn:hover {
      box-shadow: 0 6px 20px rgba(224, 64, 251, 0.8);
    }

    /* 図鑑スライドパネル */
    #pokedex {
      position: absolute;
      top: 72px;
      left: 20px;
      width: 280px;
      max-height: 0;
      opacity: 0;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
      transform: translateY(-16px) scaleY(0.85);
      transform-origin: top center;
      transition: max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.3s ease,
                  padding 0.35s ease,
                  transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      z-index: 5;
    }
    #pokedex.open {
      max-height: 620px;
      opacity: 1;
      padding-top: 15px;
      padding-bottom: 15px;
      transform: translateY(0) scaleY(1);
      pointer-events: auto;
    }
    #pokedex h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .dex-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 14px;
      transition: all 0.3s;
    }
    .dex-item.unlocked {
      background: rgba(76, 175, 80, 0.25);
      border: 1px solid rgba(76, 175, 80, 0.5);
    }
    .dex-item.rare.unlocked {
      background: rgba(255, 215, 0, 0.25);
      border: 1px solid rgba(255, 215, 0, 0.8);
      color: #ffd700;
      font-weight: bold;
    }
    .dex-item.super-rare.unlocked {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.4), rgba(255, 111, 0, 0.4));
      border: 1px solid #fff176;
      color: #fff59d;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    .dex-item.secret.unlocked {
      background: linear-gradient(90deg, rgba(0, 188, 212, 0.35), rgba(156, 39, 176, 0.35));
      border: 1px solid #80deea;
      color: #e0f7fa;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }

    /* コード入力モーダル画面 */
    #code-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: 320px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 15;
      text-align: center;
    }
    #code-modal.open {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
    #code-modal h3 {
      margin: 0 0 12px 0;
      font-size: 20px;
      color: #f3e5f5;
    }
    #code-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      outline: none;
      margin-bottom: 12px;
      text-align: center;
      user-select: text;
    }
    #code-input:focus {
      border-color: #e040fb;
      box-shadow: 0 0 12px rgba(224, 64, 251, 0.5);
    }
    .code-btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    #code-submit-btn {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, #9c27b0, #e040fb);
      color: white;
      cursor: pointer;
    }
    #code-submit-btn:hover {
      filter: brightness(1.1);
    }
    #code-close-btn {
      padding: 10px 16px;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: white;
      cursor: pointer;
    }
    #code-close-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    #code-feedback {
      margin-top: 10px;
      font-size: 13px;
      min-height: 18px;
      color: #ff80ab;
    }

    #status-box {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    /* 右下の現在倍率パネル */
    #rate-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 15px;
      font-weight: bold;
      text-align: right;
      line-height: 1.5;
    }
    #rate-multiplier {
      font-size: 22px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    #clear-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: auto;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    #clear-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.8);
    }
    #clear-btn:active {
      transform: scale(0.95);
    }
    #notification {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(45deg, #f1c40f, #e67e22);
      color: #fff;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 0 30px rgba(241, 196, 15, 0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }
    #notification.show {
      transform: translate(-50%, -50%) scale(1);
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.8);
      padding: 20px 30px;
      border-radius: 10px;
    }
  </style>
  <!-- Three.js & MediaPipe Hands -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="container">
    <div id="loading">カメラとAIモデルを読み込み中...</div>
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="beam-canvas"></canvas>

    <div id="ui-layer">
      <div id="top-left-buttons">
        <button id="pokedex-toggle-btn" class="top-btn">📖 図鑑</button>
        <button id="code-toggle-btn" class="top-btn">🔑 コード</button>
      </div>

      <div id="pokedex" class="panel">
        <h2>📖 3Dモデル図鑑 <span id="dex-count">0/12</span></h2>
        <div id="dex-list"></div>
      </div>

      <!-- コード入力画面 -->
      <div id="code-modal" class="panel">
        <h3>🔑 シークレットコード入力</h3>
        <input type="text" id="code-input" placeholder="コードを入力..." autocomplete="off" />
        <div class="code-btn-row">
          <button id="code-submit-btn">決定</button>
          <button id="code-close-btn">閉じる</button>
        </div>
        <div id="code-feedback"></div>
      </div>

      <button id="clear-btn">⚡ 全削除ビーム</button>

      <div id="notification">✨ RARE GET! ✨</div>

      <div id="status-box" class="panel">
        <div>✋ <b>パー</b>：手のひらから3Dモデル出現＆落下</div>
        <div>🤏 <b>つまむ</b>：モデルを掴んで持ち上げる・投げる</div>
        <div>状態: <span id="hand-state" style="color:#4caf50; font-weight:bold;">待機中</span></div>
      </div>

      <div id="rate-box" class="panel">
        <div>レア確率倍率</div>
        <div id="rate-multiplier">1倍</div>
        <div id="rate-timer" style="font-size:11px; color:#ccc;">次の2倍まで: 20秒</div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 図鑑とモデル定義
    // ==========================================
    const MODEL_TYPES = [
      { id: 'duck', name: 'アヒル', baseRate: null, rare: 0, secret: false, count: 0 },
      { id: 'plane', name: '飛行機', baseRate: null, rare: 0, secret: false, count: 0 },
      { id: 'train', name: '電車', baseRate: null, rare: 0, secret: false, count: 0 },
      { id: 'monkey', name: '猿', baseRate: null, rare: 0, secret: false, count: 0 },
      { id: 'smile', name: '黄色い丸いスマイル', baseRate: null, rare: 0, secret: false, count: 0 },
      { id: 'gold_duck', name: '金のアヒル', baseRate: 1.0, rare: 1, secret: false, count: 0 },
      { id: 'gold_house', name: '金の家', baseRate: 0.5, rare: 1, secret: false, count: 0 },
      { id: 'gold_tower', name: '金の東京タワー', baseRate: 0.1, rare: 2, secret: false, count: 0 },
      { id: 'gold_clock', name: '金の時計', baseRate: 0.05, rare: 2, secret: false, count: 0 },
      { id: 'gold_smile', name: '金のスマイル', baseRate: 0.001, rare: 2, secret: false, count: 0 },
      { id: 'polar_bear', name: '青いオーラのシロクマ', baseRate: null, rare: 2, secret: true, count: 0 },
      { id: 'green_earth', name: '緑のオーラの地球', baseRate: null, rare: 2, secret: true, count: 0 }
    ];

    // 図鑑ボタンの開閉処理
    const pokedexBtn = document.getElementById('pokedex-toggle-btn');
    const pokedexPanel = document.getElementById('pokedex');
    pokedexBtn.addEventListener('click', () => {
      pokedexPanel.classList.toggle('open');
    });

    // コード画面の開閉＆入力処理
    const codeToggleBtn = document.getElementById('code-toggle-btn');
    const codeModal = document.getElementById('code-modal');
    const codeInput = document.getElementById('code-input');
    const codeSubmitBtn = document.getElementById('code-submit-btn');
    const codeCloseBtn = document.getElementById('code-close-btn');
    const codeFeedback = document.getElementById('code-feedback');

    function openCodeModal() {
      codeModal.classList.add('open');
      codeFeedback.innerText = '';
      codeInput.value = '';
      setTimeout(() => codeInput.focus(), 50);
    }

    function closeCodeModal() {
      codeModal.classList.remove('open');
    }

    codeToggleBtn.addEventListener('click', () => {
      if (codeModal.classList.contains('open')) {
        closeCodeModal();
      } else {
        openCodeModal();
      }
    });

    codeCloseBtn.addEventListener('click', closeCodeModal);

    function handleCodeSubmit() {
      const val = codeInput.value.trim().toLowerCase();
      if (!val) return;

      if (val === 'honey') {
        const bearInfo = MODEL_TYPES.find(m => m.id === 'polar_bear');
        spawnSpecificModelAt(bearInfo, new THREE.Vector3(0, 2.2, 0));
        showNotification('❄️🐻 青いオーラのシロクマ出現！ 🐻❄️', true);
        closeCodeModal();
      } else if (val === 'ramen') {
        const earthInfo = MODEL_TYPES.find(m => m.id === 'green_earth');
        spawnSpecificModelAt(earthInfo, new THREE.Vector3(0, 2.2, 0));
        showNotification('🌍✨ 緑のオーラの地球出現！ ✨🌍', true);
        closeCodeModal();
      } else {
        codeFeedback.innerText = '❌ コードが違います';
      }
    }

    codeSubmitBtn.addEventListener('click', handleCodeSubmit);
    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        handleCodeSubmit();
      } else if (e.key === 'Escape') {
        closeCodeModal();
      }
    });

    // 20秒ごとにレア確率倍率が 1倍 → 2倍 → 4倍 → 8倍 → 10倍 → 20倍 → 50倍 → 100倍 → 200倍 → 500倍 → 750倍 → 1000倍 と上昇
    const MULTIPLIER_STEPS = [1, 2, 4, 8, 10, 20, 50, 100, 200, 500, 750, 1000];
    const STEP_INTERVAL = 20;
    let multiplierStepIndex = 0;
    let elapsedForMultiplier = 0;

    // 1000倍到達後、30秒ごとにラッキーガチャが発動
    const LUCKY_GACHA_INTERVAL = 30;
    let elapsedForLuckyGacha = 0;

    function getCurrentMultiplier() {
      return MULTIPLIER_STEPS[multiplierStepIndex];
    }

    function isMaxMultiplierReached() {
      return multiplierStepIndex >= MULTIPLIER_STEPS.length - 1;
    }

    function formatRateDisplay(item) {
      if (item.secret) return 'コード';
      if (item.baseRate === null) return '通常';
      const val = Math.min(100, item.baseRate * getCurrentMultiplier());
      return `${Number(val.toFixed(3))}%`;
    }

    function updateRateUI() {
      const mult = getCurrentMultiplier();
      document.getElementById('rate-multiplier').innerText = `${mult}倍`;
      const timerEl = document.getElementById('rate-timer');
      if (!isMaxMultiplierReached()) {
        const remaining = Math.max(0, Math.ceil(STEP_INTERVAL - elapsedForMultiplier));
        const nextMult = MULTIPLIER_STEPS[multiplierStepIndex + 1];
        timerEl.innerText = `次の${nextMult}倍まで: ${remaining}秒`;
      } else {
        const remainingLucky = Math.max(0, Math.ceil(LUCKY_GACHA_INTERVAL - elapsedForLuckyGacha));
        timerEl.innerText = `🎰 ラッキーガチャまで: ${remainingLucky}秒`;
      }
    }
    updateRateUI();

    function updatePokedexUI() {
      const listEl = document.getElementById('dex-list');
      listEl.innerHTML = '';
      let unlockedCount = 0;

      MODEL_TYPES.forEach(item => {
        if (item.count > 0) unlockedCount++;
        const div = document.createElement('div');
        let rareClass = item.secret ? 'secret' : (item.rare === 2 ? 'super-rare' : (item.rare === 1 ? 'rare' : ''));
        div.className = `dex-item ${item.count > 0 ? 'unlocked' : ''} ${rareClass}`;
        // 未入手時は「？？？」。シロクマは指定通り解放後も「???」表記、地球は解放後に名前表示
        let displayName = '？？？';
        if (item.count > 0) {
          displayName = item.id === 'polar_bear' ? '???' : item.name;
        }
        const rateText = formatRateDisplay(item);
        div.innerHTML = `
          <span>${displayName}</span>
          <span>${item.count > 0 ? `×${item.count} (${rateText})` : rateText}</span>
        `;
        listEl.appendChild(div);
      });

      document.getElementById('dex-count').innerText = `${unlockedCount}/${MODEL_TYPES.length}`;
    }
    updatePokedexUI();

    function showNotification(text, isSuperRare = false) {
      const el = document.getElementById('notification');
      el.innerText = text;
      el.style.background = isSuperRare
        ? 'linear-gradient(45deg, #ff007f, #ffd700, #ff8c00)'
        : 'linear-gradient(45deg, #f1c40f, #e67e22)';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    // ラッキーガチャ専用抽選（金の東京タワー 50%、金の時計 35%、金のスマイル 15%）
    function rollLuckyGachaType() {
      const r = Math.random() * 100;
      if (r < 50) return MODEL_TYPES.find(m => m.id === 'gold_tower'); // 50%
      if (r < 85) return MODEL_TYPES.find(m => m.id === 'gold_clock'); // 35%
      return MODEL_TYPES.find(m => m.id === 'gold_smile');             // 15%
    }

    function rollModelType() {
      const mult = getCurrentMultiplier();
      const rawSmile = 0.001 * mult;
      const rawClock = 0.05 * mult;
      const rawTower = 0.1 * mult;
      const rawHouse = 0.5 * mult;
      const rawDuck  = 1.0 * mult;
      const totalRare = rawSmile + rawClock + rawTower + rawHouse + rawDuck;

      const scale = totalRare > 100 ? (100 / totalRare) : 1;
      const smileChance = rawSmile * scale;
      const clockChance = rawClock * scale;
      const towerChance = rawTower * scale;
      const houseChance = rawHouse * scale;
      const duckChance  = rawDuck * scale;

      const r = Math.random() * 100;
      let cumulative = 0;

      cumulative += smileChance;
      if (r < cumulative) return MODEL_TYPES.find(m => m.id === 'gold_smile');

      cumulative += clockChance;
      if (r < cumulative) return MODEL_TYPES.find(m => m.id === 'gold_clock');

      cumulative += towerChance;
      if (r < cumulative) return MODEL_TYPES.find(m => m.id === 'gold_tower');

      cumulative += houseChance;
      if (r < cumulative) return MODEL_TYPES.find(m => m.id === 'gold_house');

      cumulative += duckChance;
      if (r < cumulative) return MODEL_TYPES.find(m => m.id === 'gold_duck');

      const normals = MODEL_TYPES.filter(m => m.rare === 0 && !m.secret);
      return normals[Math.floor(Math.random() * normals.length)];
    }

    // ==========================================
    // 2. Three.js & 環境マップ・オーラテクスチャ生成
    // ==========================================
    const threeCanvas = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    function createStudioEnvMap() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x221a0a);

      const lightPanels = [
        { pos: [10, 15, 10], size: [12, 12], color: 0xffffff, intensity: 4 },
        { pos: [-12, 8, 8], size: [10, 15], color: 0xfff3c4, intensity: 3 },
        { pos: [0, -10, 10], size: [20, 6], color: 0xffd54f, intensity: 2 },
        { pos: [0, 15, -10], size: [20, 10], color: 0xffffff, intensity: 3 }
      ];
      lightPanels.forEach(p => {
        const mat = new THREE.MeshBasicMaterial({ color: p.color });
        mat.color.multiplyScalar(p.intensity);
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(p.size[0], p.size[1]), mat);
        mesh.position.set(...p.pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      });

      const envRT = pmremGenerator.fromScene(envScene);
      pmremGenerator.dispose();
      return envRT.texture;
    }
    scene.environment = createStudioEnvMap();

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight1.position.set(6, 12, 10);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffe082, 0.9);
    dirLight2.position.set(-8, 5, 8);
    scene.add(dirLight2);

    const rimLight = new THREE.PointLight(0xffffff, 1.2, 30);
    rimLight.position.set(0, -5, 12);
    scene.add(rimLight);

    function createGoldMaterial() {
      return new THREE.MeshStandardMaterial({
        color: 0xffcf40,
        metalness: 1.0,
        roughness: 0.12,
        envMapIntensity: 1.6
      });
    }

    // 汎用ラジアルオーラテクスチャ生成（金・青・緑対応）
    const auraTextureCache = {};
    function getAuraTexture(colorKey) {
      if (auraTextureCache[colorKey]) return auraTextureCache[colorKey];
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 12, 128, 128, 128);

      if (colorKey === 'blue') {
        grad.addColorStop(0, 'rgba(220, 248, 255, 1.0)');
        grad.addColorStop(0.28, 'rgba(0, 195, 255, 0.85)');
        grad.addColorStop(0.6, 'rgba(0, 110, 255, 0.35)');
        grad.addColorStop(1, 'rgba(0, 80, 255, 0.0)');
      } else if (colorKey === 'green') {
        grad.addColorStop(0, 'rgba(225, 255, 230, 1.0)');
        grad.addColorStop(0.28, 'rgba(0, 230, 118, 0.85)');
        grad.addColorStop(0.6, 'rgba(0, 180, 75, 0.35)');
        grad.addColorStop(1, 'rgba(0, 130, 50, 0.0)');
      } else {
        grad.addColorStop(0, 'rgba(255, 250, 200, 1.0)');
        grad.addColorStop(0.28, 'rgba(255, 215, 0, 0.85)');
        grad.addColorStop(0.6, 'rgba(255, 170, 0, 0.35)');
        grad.addColorStop(1, 'rgba(255, 140, 0, 0.0)');
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      auraTextureCache[colorKey] = new THREE.CanvasTexture(canvas);
      return auraTextureCache[colorKey];
    }

    function attachAuraToGroup(group, colorKey, shellRadius = 0.86) {
      const tex = getAuraTexture(colorKey);
      let spriteColor = 0xffe066;
      let shellColor = 0xffd700;
      let particleColor = 0xfff59d;

      if (colorKey === 'blue') {
        spriteColor = 0x40c4ff;
        shellColor = 0x00b0ff;
        particleColor = 0xb3e5fc;
      } else if (colorKey === 'green') {
        spriteColor = 0x69f0ae;
        shellColor = 0x00e676;
        particleColor = 0xb9f6ca;
      }

      const auraMat = new THREE.SpriteMaterial({
        map: tex,
        color: spriteColor,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const auraSprite = new THREE.Sprite(auraMat);
      auraSprite.scale.set(2.6, 2.6, 1);
      group.add(auraSprite);

      const shellMat = new THREE.MeshBasicMaterial({
        color: shellColor,
        transparent: true,
        opacity: 0.25,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const auraShell = new THREE.Mesh(new THREE.SphereGeometry(shellRadius, 24, 24), shellMat);
      group.add(auraShell);

      const particleCount = 48;
      const pPositions = new Float32Array(particleCount * 3);
      for (let k = 0; k < particleCount; k++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = shellRadius * 0.95 + Math.random() * 0.45;
        pPositions[k * 3] = r * Math.sin(phi) * Math.cos(theta);
        pPositions[k * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        pPositions[k * 3 + 2] = r * Math.cos(phi);
      }
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
      const pMat = new THREE.PointsMaterial({
        color: particleColor,
        size: 0.14,
        map: tex,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const auraParticles = new THREE.Points(pGeo, pMat);
      group.add(auraParticles);

      return {
        sprite: auraSprite,
        shell: auraShell,
        particles: auraParticles,
        phase: Math.random() * Math.PI * 2
      };
    }

    // 地球のテクスチャ生成（青い海と緑の大陸＋雲）
    let earthTexture = null;
    function getEarthTexture() {
      if (earthTexture) return earthTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // 海
      ctx.fillStyle = '#1565c0';
      ctx.fillRect(0, 0, 512, 256);

      // 大陸（簡略化した世界地図風ポリゴン＆ブロブ）
      ctx.fillStyle = '#43a047';
      const continents = [
        // 北米
        [[70, 50], [140, 45], [155, 95], [115, 130], [85, 100]],
        // 南米
        [[135, 145], [175, 155], [165, 215], [140, 225], [130, 180]],
        // ユーラシア
        [[245, 45], [390, 40], [420, 95], [375, 125], [295, 115], [250, 90]],
        // アフリカ
        [[245, 115], [305, 120], [315, 175], [280, 210], [255, 170]],
        // オーストラリア
        [[385, 160], [435, 160], [440, 200], [390, 205]],
        // グリーンランド
        [[175, 25], [215, 25], [205, 50], [180, 45]]
      ];
      continents.forEach(poly => {
        ctx.beginPath();
        poly.forEach(([x, y], idx) => {
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.fill();
      });

      // 極地の氷
      ctx.fillStyle = '#e3f2fd';
      ctx.fillRect(0, 0, 512, 16);
      ctx.fillRect(0, 240, 512, 16);

      // 薄い雲の筋
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      for (let i = 0; i < 18; i++) {
        const cx = (i * 73) % 512;
        const cy = 30 + ((i * 41) % 190);
        ctx.beginPath();
        ctx.ellipse(cx, cy, 38, 7, 0.1, 0, Math.PI * 2);
        ctx.fill();
      }

      earthTexture = new THREE.CanvasTexture(canvas);
      return earthTexture;
    }

    const spawnedObjects = [];

    function spawnSpecificModelAt(modelInfo, worldPos) {
      modelInfo.count++;
      updatePokedexUI();

      if (!modelInfo.secret) {
        if (modelInfo.id === 'gold_smile') {
          showNotification(`🌟 神話級0.001%！「${modelInfo.name}」光臨！！ 🌟`, true);
        } else if (modelInfo.id === 'gold_clock') {
          showNotification(`⌚ 驚異のレア！「${modelInfo.name}」出現！！ ⌚`, true);
        } else if (modelInfo.rare === 2) {
          showNotification(`👑 奇跡のレア！「${modelInfo.name}」降臨！！ 👑`, true);
        } else if (modelInfo.rare === 1) {
          showNotification(`✨ 超レア！「${modelInfo.name}」出現！ ✨`, false);
        }
      }

      const mesh = create3DModel(modelInfo.id);
      mesh.position.set(worldPos.x, worldPos.y, 0);
      scene.add(mesh);
      spawnedObjects.push(mesh);
    }

    function spawnModelAt(worldPos) {
      const modelInfo = rollModelType();
      spawnSpecificModelAt(modelInfo, worldPos);
    }

    function triggerLuckyGacha() {
      const modelInfo = rollLuckyGachaType();
      const vFov = (camera.fov * Math.PI) / 180;
      const halfH = Math.tan(vFov / 2) * camera.position.z;
      const halfW = halfH * camera.aspect;
      const randX = (Math.random() - 0.5) * halfW * 1.1;
      const spawnY = Math.min(halfH * 0.65, 3.2);

      spawnSpecificModelAt(modelInfo, new THREE.Vector3(randX, spawnY, 0));
      showNotification(`🎰 ラッキーガチャ！「${modelInfo.name}」GET！！ 🎰`, true);
    }

    function normalizedToWorld(nx, ny) {
      const ndcX = (1 - nx) * 2 - 1;
      const ndcY = -(ny * 2 - 1);
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // ==========================================
    // 4. 確実・高速な物理演算エンジン（重力・地面・モデル同士の衝突）
    // ==========================================
    function updatePhysics(dt) {
      const vFov = (camera.fov * Math.PI) / 180;
      const halfH = Math.tan(vFov / 2) * camera.position.z;
      const halfW = halfH * camera.aspect;

      const gravity = -22.0;
      const restitution = 0.45;
      const floorFriction = 0.92;

      for (let i = 0; i < spawnedObjects.length; i++) {
        const obj = spawnedObjects[i];
        const p = obj.userData;

        if (p.isGrabbed) continue;

        p.vy += gravity * dt;

        obj.position.x += p.vx * dt;
        obj.position.y += p.vy * dt;
        obj.position.z = 0;

        obj.rotation.x += p.rotVx * dt;
        obj.rotation.y += p.rotVy * dt;
        obj.rotation.z += p.rotVz * dt;

        const floorY = -halfH + p.radius;
        if (obj.position.y < floorY) {
          obj.position.y = floorY;
          if (p.vy < 0) {
            p.vy = -p.vy * restitution;
            if (Math.abs(p.vy) < 0.8) p.vy = 0;
          }
          p.vx *= floorFriction;
          p.rotVx *= 0.85;
          p.rotVy *= 0.92;
          p.rotVz *= 0.85;
        }

        const leftX = -halfW + p.radius;
        const rightX = halfW - p.radius;
        if (obj.position.x < leftX) {
          obj.position.x = leftX;
          p.vx = Math.abs(p.vx) * restitution;
        } else if (obj.position.x > rightX) {
          obj.position.x = rightX;
          p.vx = -Math.abs(p.vx) * restitution;
        }
      }

      const solverIterations = 4;
      for (let iter = 0; iter < solverIterations; iter++) {
        for (let i = 0; i < spawnedObjects.length; i++) {
          for (let j = i + 1; j < spawnedObjects.length; j++) {
            const objA = spawnedObjects[i];
            const objB = spawnedObjects[j];
            const pA = objA.userData;
            const pB = objB.userData;

            const dx = objB.position.x - objA.position.x;
            const dy = objB.position.y - objA.position.y;
            const distSq = dx * dx + dy * dy;
            const minDist = pA.radius + pB.radius;

            if (distSq < minDist * minDist) {
              const dist = Math.sqrt(distSq) || 0.001;
              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = minDist - dist;

              if (pA.isGrabbed && !pB.isGrabbed) {
                objB.position.x += nx * overlap;
                objB.position.y += ny * overlap;
              } else if (!pA.isGrabbed && pB.isGrabbed) {
                objA.position.x -= nx * overlap;
                objA.position.y -= ny * overlap;
              } else if (!pA.isGrabbed && !pB.isGrabbed) {
                const halfOverlap = overlap * 0.5;
                objA.position.x -= nx * halfOverlap;
                objA.position.y -= ny * halfOverlap;
                objB.position.x += nx * halfOverlap;
                objB.position.y += ny * halfOverlap;
              }

              if (iter === 0) {
                const rvx = pB.vx - pA.vx;
                const rvy = pB.vy - pA.vy;
                const velAlongNormal = rvx * nx + rvy * ny;

                if (velAlongNormal < 0) {
                  const impulse = -(1 + restitution) * velAlongNormal * 0.5;
                  if (!pA.isGrabbed) {
                    pA.vx -= impulse * nx;
                    pA.vy -= impulse * ny;
                    pA.rotVz += impulse * nx * 1.5;
                  }
                  if (!pB.isGrabbed) {
                    pB.vx += impulse * nx;
                    pB.vy += impulse * ny;
                    pB.rotVz -= impulse * nx * 1.5;
                  }
                }
              }
            }
          }
        }
      }
    }

    // ==========================================
    // 5. 手のジェスチャー認識 (MediaPipe Hands + 自己復旧カメラループ)
    // ==========================================
    const videoElement = document.getElementById('webcam');
    const handStateEl = document.getElementById('hand-state');

    let lastSpawnTime = 0;
    let wasOpenHand = false;
    let grabbedObject = null;
    let prevPinchPos = null;
    let throwVelocity = new THREE.Vector3();

    function dist2D(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function isHandOpen(landmarks) {
      const wrist = landmarks[0];
      const fingerTips = [8, 12, 16, 20];
      const fingerPips = [6, 10, 14, 18];
      let extendedCount = 0;

      for (let i = 0; i < 4; i++) {
        if (dist2D(wrist, landmarks[fingerTips[i]]) > dist2D(wrist, landmarks[fingerPips[i]]) * 1.08) {
          extendedCount++;
        }
      }
      const thumbExtended = dist2D(landmarks[4], landmarks[17]) > dist2D(landmarks[2], landmarks[17]) * 1.02;
      return extendedCount >= 4 && thumbExtended;
    }

    function isPinching(landmarks) {
      const pinchDist = dist2D(landmarks[4], landmarks[8]);
      const handSize = dist2D(landmarks[0], landmarks[9]);
      return pinchDist < handSize * 0.36;
    }

    function releaseGrabbedObject() {
      if (!grabbedObject) return;
      const p = grabbedObject.userData;
      p.isGrabbed = false;
      p.vx = Math.max(-25, Math.min(25, throwVelocity.x * 35));
      p.vy = Math.max(-25, Math.min(25, throwVelocity.y * 35));
      grabbedObject = null;
      prevPinchPos = null;
    }

    function onResults(results) {
      document.getElementById('loading').style.display = 'none';

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        handStateEl.innerText = '手を検知していません';
        handStateEl.style.color = '#aaa';
        wasOpenHand = false;
        releaseGrabbedObject();
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const open = isHandOpen(landmarks);
      const pinch = isPinching(landmarks);

      if (pinch) {
        handStateEl.innerText = '🤏 つまみ中 (モデル移動)';
        handStateEl.style.color = '#ff9800';
        wasOpenHand = false;

        const midX = (landmarks[4].x + landmarks[8].x) / 2;
        const midY = (landmarks[4].y + landmarks[8].y) / 2;
        const pinchWorldPos = normalizedToWorld(midX, midY);
        pinchWorldPos.z = 0;

        if (!grabbedObject) {
          let minDist = 1.8;
          for (let obj of spawnedObjects) {
            const d = obj.position.distanceTo(pinchWorldPos);
            if (d < minDist) {
              minDist = d;
              grabbedObject = obj;
            }
          }
          if (grabbedObject) {
            prevPinchPos = pinchWorldPos.clone();
            throwVelocity.set(0, 0, 0);
          }
        }

        if (grabbedObject) {
          grabbedObject.userData.isGrabbed = true;
          if (prevPinchPos) {
            throwVelocity.subVectors(pinchWorldPos, prevPinchPos);
            prevPinchPos.copy(pinchWorldPos);
          }
          grabbedObject.position.lerp(pinchWorldPos, 0.5);
          grabbedObject.userData.vx = 0;
          grabbedObject.userData.vy = 0;
        }
        return;
      } else {
        releaseGrabbedObject();
      }

      if (open) {
        handStateEl.innerText = '✋ パー検知！';
        handStateEl.style.color = '#4caf50';

        const now = Date.now();
        if (!wasOpenHand || (now - lastSpawnTime > 750)) {
          const palmX = (landmarks[0].x + landmarks[9].x) / 2;
          const palmY = (landmarks[0].y + landmarks[9].y) / 2;
          const worldPos = normalizedToWorld(palmX, palmY);

          spawnModelAt(worldPos);
          lastSpawnTime = now;
        }
        wasOpenHand = true;
      } else {
        handStateEl.innerText = '✊ ニュートラル';
        handStateEl.style.color = '#2196f3';
        wasOpenHand = false;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });
    hands.onResults(onResults);

    let isSendingFrame = false;
    let lastProcessedFrameTime = Date.now();

    async function initWebcamAndLoop() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const tracks = stream.getVideoTracks();
        if (tracks.length > 0) {
          tracks[0].addEventListener('ended', () => {
            setTimeout(initWebcamAndLoop, 500);
          });
        }
      } catch (err) {
        document.getElementById('loading').innerText = 'カメラにアクセスできません。権限を確認してください。';
        return;
      }

      async function processVideoFrame() {
        const now = Date.now();
        if (isSendingFrame && now - lastProcessedFrameTime > 5000) {
          isSendingFrame = false;
        }

        if (!isSendingFrame && videoElement.readyState >= 2 && videoElement.videoWidth > 0) {
          isSendingFrame = true;
          lastProcessedFrameTime = now;
          try {
            await hands.send({ image: videoElement });
          } catch (e) {
          } finally {
            isSendingFrame = false;
            lastProcessedFrameTime = Date.now();
          }
        }
        requestAnimationFrame(processVideoFrame);
      }

      requestAnimationFrame(processVideoFrame);
    }

    initWebcamAndLoop();

    // ==========================================
    // 6. 全削除ビームエフェクト & 削除処理
    // ==========================================
    const beamCanvas = document.getElementById('beam-canvas');
    const bCtx = beamCanvas.getContext('2d');
    beamCanvas.width = window.innerWidth;
    beamCanvas.height = window.innerHeight;

    let beamActive = false;
    let beamProgress = 0;

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (beamActive) return;
      beamActive = true;
      beamProgress = 0;
      if (grabbedObject && grabbedObject.userData.indestructible) {
      } else {
        grabbedObject = null;
      }
    });

    function updateAndDrawBeam() {
      bCtx.clearRect(0, 0, beamCanvas.width, beamCanvas.height);
      if (!beamActive) return;

      beamProgress += 0.035;
      const w = beamCanvas.width;
      const h = beamCanvas.height;
      const beamX = w * Math.min(beamProgress * 1.3, 1.2);

      if (beamProgress < 0.3) {
        bCtx.fillStyle = `rgba(0, 229, 255, ${(0.3 - beamProgress) * 0.8})`;
        bCtx.fillRect(0, 0, w, h);
      }

      const grad = bCtx.createLinearGradient(0, 0, beamX, 0);
      grad.addColorStop(0, 'rgba(0, 229, 255, 0.1)');
      grad.addColorStop(0.8, 'rgba(0, 229, 255, 0.8)');
      grad.addColorStop(1, '#ffffff');

      bCtx.fillStyle = grad;
      bCtx.fillRect(0, 0, beamX, h);

      bCtx.shadowBlur = 40;
      bCtx.shadowColor = '#00e5ff';
      bCtx.fillStyle = '#ffffff';
      bCtx.fillRect(beamX - 25, 0, 50, h);
      bCtx.shadowBlur = 0;

      for (let i = spawnedObjects.length - 1; i >= 0; i--) {
        const obj = spawnedObjects[i];
        if (obj.userData.indestructible) continue;

        const proj = obj.position.clone().project(camera);
        const screenX = (proj.x * 0.5 + 0.5) * w;

        if (screenX <= beamX) {
          if (grabbedObject === obj) grabbedObject = null;
          scene.remove(obj);
          spawnedObjects.splice(i, 1);
        }
      }

      if (beamProgress >= 1.1) {
        beamActive = false;
        for (let i = spawnedObjects.length - 1; i >= 0; i--) {
          const obj = spawnedObjects[i];
          if (!obj.userData.indestructible) {
            if (grabbedObject === obj) grabbedObject = null;
            scene.remove(obj);
            spawnedObjects.splice(i, 1);
          }
        }
      }
    }

    // ==========================================
    // 7. メインアニメーションループ
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();

      if (!isMaxMultiplierReached()) {
        elapsedForMultiplier += dt;
        if (elapsedForMultiplier >= STEP_INTERVAL) {
          elapsedForMultiplier -= STEP_INTERVAL;
          multiplierStepIndex++;
          const newMult = getCurrentMultiplier();
          showNotification(`🔥 レア確率が ${newMult}倍 にアップ！ 🔥`, newMult >= 10);
          updatePokedexUI();
        }
        updateRateUI();
      } else {
        // 1000倍到達後、30秒ごとにラッキーガチャを発動
        elapsedForLuckyGacha += dt;
        if (elapsedForLuckyGacha >= LUCKY_GACHA_INTERVAL) {
          elapsedForLuckyGacha -= LUCKY_GACHA_INTERVAL;
          triggerLuckyGacha();
        }
        updateRateUI();
      }

      updatePhysics(dt);

      spawnedObjects.forEach(obj => {
        const targetS = obj.userData.isGrabbed ? 1.05 : obj.userData.targetScale;
        obj.scale.lerp(new THREE.Vector3(targetS, targetS, targetS), 0.18);

        if (obj.userData.aura) {
          const aura = obj.userData.aura;
          const pulse = Math.sin(elapsed * 5 + aura.phase);
          const s = 2.4 + pulse * 0.35;
          aura.sprite.scale.set(s, s, 1);
          aura.sprite.material.opacity = 0.78 + pulse * 0.2;

          const shellScale = 1.0 + pulse * 0.06;
          aura.shell.scale.set(shellScale, shellScale, shellScale);
          aura.shell.material.opacity = 0.22 + pulse * 0.1;

          aura.particles.rotation.y += dt * 1.6;
          aura.particles.rotation.z += dt * 1.1;
        }
      });

      renderer.render(scene, camera);
      updateAndDrawBeam();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      beamCanvas.width = window.innerWidth;
      beamCanvas.height = window.innerHeight;
    });
  </script>
</body>
