<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3Dシュミレーション</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #beam-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
    }
    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
    }
    .panel {
      pointer-events: auto;
      background: rgba(20, 25, 35, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: white;
      padding: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #pokedex {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 270px;
    }
    #pokedex h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .dex-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 5px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 14px;
      transition: all 0.3s;
    }
    .dex-item.unlocked {
      background: rgba(76, 175, 80, 0.25);
      border: 1px solid rgba(76, 175, 80, 0.5);
    }
    .dex-item.rare.unlocked {
      background: rgba(255, 215, 0, 0.25);
      border: 1px solid rgba(255, 215, 0, 0.8);
      color: #ffd700;
      font-weight: bold;
    }
    .dex-item.super-rare.unlocked {
      background: linear-gradient(90deg, rgba(255, 215, 0, 0.4), rgba(255, 111, 0, 0.4));
      border: 1px solid #fff176;
      color: #fff59d;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    #status-box {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 13px;
      line-height: 1.6;
    }
    #clear-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: auto;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.5);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    #clear-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.8);
    }
    #clear-btn:active {
      transform: scale(0.95);
    }
    #notification {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(45deg, #f1c40f, #e67e22);
      color: #fff;
      padding: 15px 40px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 0 30px rgba(241, 196, 15, 0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 20;
      white-space: nowrap;
    }
    #notification.show {
      transform: translate(-50%, -50%) scale(1);
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 20px;
      z-index: 10;
      background: rgba(0,0,0,0.8);
      padding: 20px 30px;
      border-radius: 10px;
    }
  </style>
  <!-- Three.js & MediaPipe Hands -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="container">
    <div id="loading">カメラとAIモデルを読み込み中...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="beam-canvas"></canvas>

    <div id="ui-layer">
      <div id="pokedex" class="panel">
        <h2>📖 3Dモデル図鑑 <span id="dex-count">0/8</span></h2>
        <div id="dex-list"></div>
      </div>

      <button id="clear-btn">⚡ 全削除ビーム</button>

      <div id="notification">✨ RARE GET! ✨</div>

      <div id="status-box" class="panel">
        <div>✋ <b>パー</b>：手のひらから3Dモデル出現＆落下</div>
        <div>🤏 <b>つまむ</b>：モデルを掴んで持ち上げる・投げる</div>
        <div>状態: <span id="hand-state" style="color:#4caf50; font-weight:bold;">待機中</span></div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. 図鑑とモデル定義
    // ==========================================
    const MODEL_TYPES = [
      { id: 'duck', name: 'アヒル', rate: '通常', rare: 0, count: 0 },
      { id: 'plane', name: '飛行機', rate: '通常', rare: 0, count: 0 },
      { id: 'train', name: '電車', rate: '通常', rare: 0, count: 0 },
      { id: 'monkey', name: '猿', rate: '通常', rare: 0, count: 0 },
      { id: 'smile', name: '黄色い丸いスマイル', rate: '通常', rare: 0, count: 0 },
      { id: 'gold_duck', name: '金のアヒル', rate: '1.0%', rare: 1, count: 0 },
      { id: 'gold_house', name: '金の家', rate: '0.5%', rare: 1, count: 0 },
      { id: 'gold_tower', name: '金の東京タワー', rate: '0.1%', rare: 2, count: 0 }
    ];

    function updatePokedexUI() {
      const listEl = document.getElementById('dex-list');
      listEl.innerHTML = '';
      let unlockedCount = 0;

      MODEL_TYPES.forEach(item => {
        if (item.count > 0) unlockedCount++;
        const div = document.createElement('div');
        let rareClass = item.rare === 2 ? 'super-rare' : (item.rare === 1 ? 'rare' : '');
        div.className = `dex-item ${item.count > 0 ? 'unlocked' : ''} ${rareClass}`;
        const displayName = item.count > 0 ? item.name : '？？？';
        div.innerHTML = `
          <span>${displayName}</span>
          <span>${item.count > 0 ? `×${item.count}` : item.rate}</span>
        `;
        listEl.appendChild(div);
      });

      document.getElementById('dex-count').innerText = `${unlockedCount}/${MODEL_TYPES.length}`;
    }
    updatePokedexUI();

    function showNotification(text, isSuperRare = false) {
      const el = document.getElementById('notification');
      el.innerText = text;
      el.style.background = isSuperRare
        ? 'linear-gradient(45deg, #ff007f, #ffd700, #ff8c00)'
        : 'linear-gradient(45deg, #f1c40f, #e67e22)';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function rollModelType() {
      const r = Math.random() * 100;
      if (r < 0.1) return MODEL_TYPES.find(m => m.id === 'gold_tower'); // 0.1%
      if (r < 0.6) return MODEL_TYPES.find(m => m.id === 'gold_house'); // 0.5% (0.1 ~ 0.6)
      if (r < 1.6) return MODEL_TYPES.find(m => m.id === 'gold_duck');  // 1.0% (0.6 ~ 1.6)
      const normals = MODEL_TYPES.filter(m => m.rare === 0);
      return normals[Math.floor(Math.random() * normals.length)];
    }

    // ==========================================
    // 2. Three.js & 光を反射する金環境マップ生成
    // ==========================================
    const threeCanvas = document.getElementById('three-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    // 金属の反射をリアルにするプロシージャル環境マップ(PMREM)を生成
    function createStudioEnvMap() {
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0x221a0a);

      // スタジオの照明パネル（これが金の表面に反射してキラキラ輝く）
      const lightPanels = [
        { pos: [10, 15, 10], size: [12, 12], color: 0xffffff, intensity: 4 },
        { pos: [-12, 8, 8], size: [10, 15], color: 0xfff3c4, intensity: 3 },
        { pos: [0, -10, 10], size: [20, 6], color: 0xffd54f, intensity: 2 },
        { pos: [0, 15, -10], size: [20, 10], color: 0xffffff, intensity: 3 }
      ];
      lightPanels.forEach(p => {
        const mat = new THREE.MeshBasicMaterial({ color: p.color });
        mat.color.multiplyScalar(p.intensity);
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(p.size[0], p.size[1]), mat);
        mesh.position.set(...p.pos);
        mesh.lookAt(0, 0, 0);
        envScene.add(mesh);
      });

      const envRT = pmremGenerator.fromScene(envScene);
      pmremGenerator.dispose();
      return envRT.texture;
    }
    scene.environment = createStudioEnvMap();

    // ライティング
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight1.position.set(6, 12, 10);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffe082, 0.9);
    dirLight2.position.set(-8, 5, 8);
    scene.add(dirLight2);

    const rimLight = new THREE.PointLight(0xffffff, 1.2, 30);
    rimLight.position.set(0, -5, 12);
    scene.add(rimLight);

    // 鏡面反射する純金マテリアル
    function createGoldMaterial() {
      return new THREE.MeshStandardMaterial({
        color: 0xffcf40,
        metalness: 1.0,
        roughness: 0.12,
        envMapIntensity: 1.6
      });
    }

    // ==========================================
    // 3. 3Dモデル生成 & 物理パラメータ設定
    // ==========================================
    function create3DModel(typeId) {
      const group = new THREE.Group();
      const goldMat = createGoldMaterial();
      const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 });
      let radius = 0.65; // 当たり判定用の半径

      if (typeId === 'duck' || typeId === 'gold_duck') {
        const isGold = typeId === 'gold_duck';
        const bodyMat = isGold ? goldMat : new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.25 });
        const beakMat = isGold ? goldMat : new THREE.MeshStandardMaterial({ color: 0xff9800, roughness: 0.3 });

        const body = new THREE.Mesh(new THREE.SphereGeometry(0.6, 24, 24), bodyMat);
        body.scale.set(1.2, 0.9, 0.9);
        group.add(body);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 24, 24), bodyMat);
        head.position.set(0.45, 0.55, 0);
        group.add(head);
        const beak = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.4, 16), beakMat);
        beak.rotation.z = -Math.PI / 2;
        beak.position.set(0.85, 0.5, 0);
        group.add(beak);
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 10), blackMat);
        eyeL.position.set(0.65, 0.68, 0.25);
        const eyeR = eyeL.clone();
        eyeR.position.z = -0.25;
        group.add(eyeL, eyeR);
        radius = 0.65;

      } else if (typeId === 'plane') {
        const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
        const blueMat = new THREE.MeshStandardMaterial({ color: 0x2196f3, roughness: 0.3 });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.6, 20), whiteMat);
        body.rotation.z = Math.PI / 2;
        group.add(body);
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), blueMat);
        nose.position.x = 0.8;
        group.add(nose);
        const wing = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.05, 1.8), blueMat);
        wing.position.set(0.1, 0, 0);
        group.add(wing);
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.4, 0.05), blueMat);
        tail.position.set(-0.65, 0.25, 0);
        group.add(tail);
        radius = 0.65;

      } else if (typeId === 'train') {
        const greenMat = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.3 });
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffeb3b, roughness: 0.3 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.65, 0.6), greenMat);
        group.add(body);
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.15, 0.62), yellowMat);
        group.add(stripe);
        for (let x of [-0.48, 0, 0.48]) {
          for (let z of [-0.32, 0.32]) {
            const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.08, 16), blackMat);
            wheel.rotation.x = Math.PI / 2;
            wheel.position.set(x, -0.35, z);
            group.add(wheel);
          }
        }
        radius = 0.62;

      } else if (typeId === 'monkey') {
        const brownMat = new THREE.MeshStandardMaterial({ color: 0x795548, roughness: 0.5 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xffccbc, roughness: 0.4 });
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 24), brownMat);
        group.add(head);
        const face = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 20), skinMat);
        face.position.set(0, -0.05, 0.22);
        group.add(face);
        const earL = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), brownMat);
        earL.position.set(-0.58, 0.05, 0);
        const earR = earL.clone();
        earR.position.x = 0.58;
        group.add(earL, earR);
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), blackMat);
        eyeL.position.set(-0.15, 0.1, 0.6);
        const eyeR = eyeL.clone();
        eyeR.position.x = 0.15;
        group.add(eyeL, eyeR);
        radius = 0.58;

      } else if (typeId === 'smile') {
        // 立体的な球体のスマイルボール
        const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffd600, roughness: 0.2, metalness: 0.05 });
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.62, 32, 32), yellowMat);
        group.add(sphere);

        // 球面に沿って配置された立体的な目
        const eyeGeo = new THREE.SphereGeometry(0.085, 16, 16);
        const eyeL = new THREE.Mesh(eyeGeo, blackMat);
        eyeL.scale.set(0.8, 1.3, 0.6);
        eyeL.position.set(-0.2, 0.18, 0.56);
        eyeL.rotation.set(-0.25, -0.3, 0);

        const eyeR = eyeL.clone();
        eyeR.position.set(0.2, 0.18, 0.56);
        eyeR.rotation.set(-0.25, 0.3, 0);
        group.add(eyeL, eyeR);

        // 球面に沿って立体的にカーブした笑顔の口
        const mouthCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-0.28, -0.06, 0.55),
          new THREE.Vector3(-0.15, -0.22, 0.58),
          new THREE.Vector3(0, -0.27, 0.59),
          new THREE.Vector3(0.15, -0.22, 0.58),
          new THREE.Vector3(0.28, -0.06, 0.55)
        ]);
        const mouthGeo = new THREE.TubeGeometry(mouthCurve, 24, 0.045, 12, false);
        const mouth = new THREE.Mesh(mouthGeo, blackMat);
        group.add(mouth);
        radius = 0.62;

      } else if (typeId === 'gold_house') {
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.9), goldMat);
        base.position.y = -0.15;
        group.add(base);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(0.82, 0.65, 4), goldMat);
        roof.rotation.y = Math.PI / 4;
        roof.position.y = 0.52;
        group.add(roof);
        const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.4, 0.18), goldMat);
        chimney.position.set(0.25, 0.52, 0.1);
        group.add(chimney);
        radius = 0.65;

      } else if (typeId === 'gold_tower') {
        // 超レア0.1%：金の東京タワー
        // 4本の脚部トラス構造
        const legPositions = [[-0.32, -0.32], [0.32, -0.32], [-0.32, 0.32], [0.32, 0.32]];
        legPositions.forEach(([lx, lz]) => {
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.12, 0.85, 8), goldMat);
          leg.position.set(lx * 0.75, -0.65, lz * 0.75);
          leg.rotation.z = lx > 0 ? 0.22 : -0.22;
          leg.rotation.x = lz > 0 ? -0.22 : 0.22;
          group.add(leg);
        });

        // 下部メインタワー
        const lowerBody = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.45, 0.8, 4), goldMat);
        lowerBody.rotation.y = Math.PI / 4;
        lowerBody.position.y = -0.45;
        group.add(lowerBody);

        // 大展望台（メインデッキ）
        const mainDeck = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.16, 0.52), goldMat);
        mainDeck.position.y = -0.02;
        group.add(mainDeck);

        // 上部タワー
        const upperBody = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.22, 0.75, 4), goldMat);
        upperBody.rotation.y = Math.PI / 4;
        upperBody.position.y = 0.42;
        group.add(upperBody);

        // 特別展望台（トップデッキ）
        const topDeck = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.12, 0.28), goldMat);
        topDeck.position.y = 0.82;
        group.add(topDeck);

        // 先端アンテナ
        const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.05, 0.55, 8), goldMat);
        antenna.position.y = 1.15;
        group.add(antenna);

        radius = 0.78;
      }

      const targetScale = 0.88;
      group.scale.set(0.01, 0.01, 0.01);

      // 自前物理演算用のデータ
      group.userData = {
        targetScale: targetScale,
        radius: radius * targetScale,
        vx: (Math.random() - 0.5) * 3.0,
        vy: 2.0, // 出現時に少し上へポップしてから落下
        rotVx: (Math.random() - 0.5) * 3.0,
        rotVy: (Math.random() - 0.5) * 4.0,
        rotVz: (Math.random() - 0.5) * 3.0,
        isGrabbed: false
      };

      return group;
    }

    const spawnedObjects = [];

    function spawnModelAt(worldPos) {
      const modelInfo = rollModelType();
      modelInfo.count++;
      updatePokedexUI();

      if (modelInfo.rare === 2) {
        showNotification(`👑 奇跡の0.1%！「${modelInfo.name}」降臨！！ 👑`, true);
      } else if (modelInfo.rare === 1) {
        showNotification(`✨ 超レア！「${modelInfo.name}」出現！ ✨`, false);
      }

      const mesh = create3DModel(modelInfo.id);
      mesh.position.set(worldPos.x, worldPos.y, 0);
      scene.add(mesh);
      spawnedObjects.push(mesh);
    }

    function normalizedToWorld(nx, ny) {
      const ndcX = (1 - nx) * 2 - 1;
      const ndcY = -(ny * 2 - 1);
      const vec = new THREE.Vector3(ndcX, ndcY, 0.5);
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      return camera.position.clone().add(dir.multiplyScalar(distance));
    }

    // ==========================================
    // 4. 確実・高速な物理演算エンジン（重力・地面・モデル同士の衝突）
    // ==========================================
    function updatePhysics(dt) {
      // カメラのZ=0平面での表示範囲を計算
      const vFov = (camera.fov * Math.PI) / 180;
      const halfH = Math.tan(vFov / 2) * camera.position.z;
      const halfW = halfH * camera.aspect;

      const gravity = -22.0;      // 重力加速度
      const restitution = 0.45;   // バウンド反発係数
      const floorFriction = 0.92; // 地面との摩擦

      // 1. 重力・速度・壁＆透明な地面との衝突処理
      for (let i = 0; i < spawnedObjects.length; i++) {
        const obj = spawnedObjects[i];
        const p = obj.userData;

        if (p.isGrabbed) continue;

        // 重力を適用して落下させる
        p.vy += gravity * dt;

        // 位置の更新
        obj.position.x += p.vx * dt;
        obj.position.y += p.vy * dt;
        obj.position.z = 0; // 2D平面上で確実にぶつかるようZを固定

        // 回転の更新
        obj.rotation.x += p.rotVx * dt;
        obj.rotation.y += p.rotVy * dt;
        obj.rotation.z += p.rotVz * dt;

        // 画面下の「透明な地面」との衝突判定
        const floorY = -halfH + p.radius;
        if (obj.position.y < floorY) {
          obj.position.y = floorY;
          if (p.vy < 0) {
            p.vy = -p.vy * restitution;
            if (Math.abs(p.vy) < 0.8) p.vy = 0; // 微振動を止める
          }
          p.vx *= floorFriction;
          p.rotVx *= 0.85;
          p.rotVy *= 0.92;
          p.rotVz *= 0.85;
        }

        // 左右の画面端との衝突判定（転がり落ち防止）
        const leftX = -halfW + p.radius;
        const rightX = halfW - p.radius;
        if (obj.position.x < leftX) {
          obj.position.x = leftX;
          p.vx = Math.abs(p.vx) * restitution;
        } else if (obj.position.x > rightX) {
          obj.position.x = rightX;
          p.vx = -Math.abs(p.vx) * restitution;
        }
      }

      // 2. モデル同士の衝突解決（反復処理で積み重なりも安定化）
      const solverIterations = 4;
      for (let iter = 0; iter < solverIterations; iter++) {
        for (let i = 0; i < spawnedObjects.length; i++) {
          for (let j = i + 1; j < spawnedObjects.length; j++) {
            const objA = spawnedObjects[i];
            const objB = spawnedObjects[j];
            const pA = objA.userData;
            const pB = objB.userData;

            const dx = objB.position.x - objA.position.x;
            const dy = objB.position.y - objA.position.y;
            const distSq = dx * dx + dy * dy;
            const minDist = pA.radius + pB.radius;

            if (distSq < minDist * minDist) {
              const dist = Math.sqrt(distSq) || 0.001;
              const nx = dx / dist;
              const ny = dy / dist;
              const overlap = minDist - dist;

              // めり込みの押し戻し
              if (pA.isGrabbed && !pB.isGrabbed) {
                objB.position.x += nx * overlap;
                objB.position.y += ny * overlap;
              } else if (!pA.isGrabbed && pB.isGrabbed) {
                objA.position.x -= nx * overlap;
                objA.position.y -= ny * overlap;
              } else if (!pA.isGrabbed && !pB.isGrabbed) {
                const halfOverlap = overlap * 0.5;
                objA.position.x -= nx * halfOverlap;
                objA.position.y -= ny * halfOverlap;
                objB.position.x += nx * halfOverlap;
                objB.position.y += ny * halfOverlap;
              }

              // 衝突時の速度交換（反発）
              if (iter === 0) {
                const rvx = pB.vx - pA.vx;
                const rvy = pB.vy - pA.vy;
                const velAlongNormal = rvx * nx + rvy * ny;

                if (velAlongNormal < 0) {
                  const impulse = -(1 + restitution) * velAlongNormal * 0.5;
                  if (!pA.isGrabbed) {
                    pA.vx -= impulse * nx;
                    pA.vy -= impulse * ny;
                    pA.rotVz += impulse * nx * 1.5;
                  }
                  if (!pB.isGrabbed) {
                    pB.vx += impulse * nx;
                    pB.vy += impulse * ny;
                    pB.rotVz -= impulse * nx * 1.5;
                  }
                }
              }
            }
          }
        }
      }
    }

    // ==========================================
    // 5. 手のジェスチャー認識 (MediaPipe Hands)
    // ==========================================
    const videoElement = document.getElementById('webcam');
    const handStateEl = document.getElementById('hand-state');

    let lastSpawnTime = 0;
    let wasOpenHand = false;
    let grabbedObject = null;
    let prevPinchPos = null;
    let throwVelocity = new THREE.Vector3();

    function dist2D(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function isHandOpen(landmarks) {
      const wrist = landmarks[0];
      const fingerTips = [8, 12, 16, 20];
      const fingerPips = [6, 10, 14, 18];
      let extendedCount = 0;

      for (let i = 0; i < 4; i++) {
        if (dist2D(wrist, landmarks[fingerTips[i]]) > dist2D(wrist, landmarks[fingerPips[i]]) * 1.15) {
          extendedCount++;
        }
      }
      const thumbExtended = dist2D(landmarks[4], landmarks[17]) > dist2D(landmarks[2], landmarks[17]) * 1.1;
      return extendedCount >= 4 && thumbExtended;
    }

    function isPinching(landmarks) {
      const pinchDist = dist2D(landmarks[4], landmarks[8]);
      const handSize = dist2D(landmarks[0], landmarks[9]);
      return pinchDist < handSize * 0.35;
    }

    function releaseGrabbedObject() {
      if (!grabbedObject) return;
      const p = grabbedObject.userData;
      p.isGrabbed = false;
      p.vx = Math.max(-25, Math.min(25, throwVelocity.x * 35));
      p.vy = Math.max(-25, Math.min(25, throwVelocity.y * 35));
      grabbedObject = null;
      prevPinchPos = null;
    }

    function onResults(results) {
      document.getElementById('loading').style.display = 'none';

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        handStateEl.innerText = '手を検知していません';
        handStateEl.style.color = '#aaa';
        wasOpenHand = false;
        releaseGrabbedObject();
        return;
      }

      const landmarks = results.multiHandLandmarks[0];
      const open = isHandOpen(landmarks);
      const pinch = isPinching(landmarks);

      // 1. つまむ動作（掴んで持ち上げる・投げる）
      if (pinch) {
        handStateEl.innerText = '🤏 つまみ中 (モデル移動)';
        handStateEl.style.color = '#ff9800';
        wasOpenHand = false;

        const midX = (landmarks[4].x + landmarks[8].x) / 2;
        const midY = (landmarks[4].y + landmarks[8].y) / 2;
        const pinchWorldPos = normalizedToWorld(midX, midY);
        pinchWorldPos.z = 0;

        if (!grabbedObject) {
          let minDist = 1.8;
          for (let obj of spawnedObjects) {
            const d = obj.position.distanceTo(pinchWorldPos);
            if (d < minDist) {
              minDist = d;
              grabbedObject = obj;
            }
          }
          if (grabbedObject) {
            prevPinchPos = pinchWorldPos.clone();
            throwVelocity.set(0, 0, 0);
          }
        }

        if (grabbedObject) {
          grabbedObject.userData.isGrabbed = true;
          if (prevPinchPos) {
            throwVelocity.subVectors(pinchWorldPos, prevPinchPos);
            prevPinchPos.copy(pinchWorldPos);
          }
          grabbedObject.position.lerp(pinchWorldPos, 0.5);
          grabbedObject.userData.vx = 0;
          grabbedObject.userData.vy = 0;
        }
        return;
      } else {
        releaseGrabbedObject();
      }

      // 2. パー動作（モデル出現）
      if (open) {
        handStateEl.innerText = '✋ パー検知！';
        handStateEl.style.color = '#4caf50';

        const now = Date.now();
        if (!wasOpenHand || (now - lastSpawnTime > 1000)) {
          const palmX = (landmarks[0].x + landmarks[9].x) / 2;
          const palmY = (landmarks[0].y + landmarks[9].y) / 2;
          const worldPos = normalizedToWorld(palmX, palmY);

          spawnModelAt(worldPos);
          lastSpawnTime = now;
        }
        wasOpenHand = true;
      } else {
        handStateEl.innerText = '✊ ニュートラル';
        handStateEl.style.color = '#2196f3';
        wasOpenHand = false;
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });
    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });
    cameraUtils.start();

    // ==========================================
    // 6. 全削除ビームエフェクト & 削除処理
    // ==========================================
    const beamCanvas = document.getElementById('beam-canvas');
    const bCtx = beamCanvas.getContext('2d');
    beamCanvas.width = window.innerWidth;
    beamCanvas.height = window.innerHeight;

    let beamActive = false;
    let beamProgress = 0;

    document.getElementById('clear-btn').addEventListener('click', () => {
      if (beamActive) return;
      beamActive = true;
      beamProgress = 0;
      grabbedObject = null;
    });

    function updateAndDrawBeam() {
      bCtx.clearRect(0, 0, beamCanvas.width, beamCanvas.height);
      if (!beamActive) return;

      beamProgress += 0.035;
      const w = beamCanvas.width;
      const h = beamCanvas.height;
      const beamX = w * Math.min(beamProgress * 1.3, 1.2);

      if (beamProgress < 0.3) {
        bCtx.fillStyle = `rgba(0, 229, 255, ${(0.3 - beamProgress) * 0.8})`;
        bCtx.fillRect(0, 0, w, h);
      }

      const grad = bCtx.createLinearGradient(0, 0, beamX, 0);
      grad.addColorStop(0, 'rgba(0, 229, 255, 0.1)');
      grad.addColorStop(0.8, 'rgba(0, 229, 255, 0.8)');
      grad.addColorStop(1, '#ffffff');

      bCtx.fillStyle = grad;
      bCtx.fillRect(0, 0, beamX, h);

      bCtx.shadowBlur = 40;
      bCtx.shadowColor = '#00e5ff';
      bCtx.fillStyle = '#ffffff';
      bCtx.fillRect(beamX - 25, 0, 50, h);
      bCtx.shadowBlur = 0;

      for (let i = spawnedObjects.length - 1; i >= 0; i--) {
        const obj = spawnedObjects[i];
        const proj = obj.position.clone().project(camera);
        const screenX = (proj.x * 0.5 + 0.5) * w;

        if (screenX <= beamX) {
          scene.remove(obj);
          spawnedObjects.splice(i, 1);
        }
      }

      if (beamProgress >= 1.1) {
        beamActive = false;
        while (spawnedObjects.length > 0) {
          scene.remove(spawnedObjects.pop());
        }
      }
    }

    // ==========================================
    // 7. メインアニメーションループ
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // 物理演算の更新（落下・地面バウンド・モデル同士の衝突）
      updatePhysics(dt);

      // スケールアニメーション更新
      spawnedObjects.forEach(obj => {
        const targetS = obj.userData.isGrabbed ? 1.05 : obj.userData.targetScale;
        obj.scale.lerp(new THREE.Vector3(targetS, targetS, targetS), 0.18);
      });

      renderer.render(scene, camera);
      updateAndDrawBeam();
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      beamCanvas.width = window.innerWidth;
      beamCanvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
